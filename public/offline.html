<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>FINANZZI — Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #111111; color: #fff; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      .mark { width: 54px; height: 54px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 18px; background: #ff5a1f; color: #111; font-weight: 900; font-size: 22px; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); letter-spacing: -0.04em; }
      p { margin: 14px 0 0; color: #b7b7b7; line-height: 1.65; }
      button { margin-top: 28px; border: 0; border-radius: 14px; padding: 14px 18px; background: #ff5a1f; color: #111; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>Você está sem conexão</h1>
      <p>Assim que sua internet voltar, o FINANZZI continua de onde você parou.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
